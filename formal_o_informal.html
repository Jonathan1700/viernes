<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Detector Formal / Informal</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #111;
    color: #eee;
    transition: background 0.4s ease;
    padding: 24px;
  }
  body.formal { background: linear-gradient(160deg, #0b1e3f, #1b3a70); }
  body.informal { background: linear-gradient(160deg, #3f1a1a, #7a2a2a); }

  h1 { margin: 0; font-size: 1.4rem; text-align: center; }

  #webcam-container {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.15);
  }

  #veredicto {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 2px;
    min-height: 4rem;
    text-align: center;
  }

  #confianza {
    font-size: 1rem;
    opacity: 0.8;
  }

  button {
    font-size: 1.1rem;
    padding: 10px 24px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: #eee;
    color: #111;
    font-weight: 600;
  }

  #aviso {
    max-width: 480px;
    text-align: center;
    font-size: 0.9rem;
    opacity: 0.85;
    line-height: 1.4;
  }

  code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

  <h1>¿Formal o informal? 🕴️👕</h1>

  <p id="aviso">
    Antes de darle a <b>Iniciar</b>, entrena tu modelo en
    <a href="https://teachablemachine.withgoogle.com/" target="_blank" style="color:#9cf;">Teachable Machine</a>
    (2 clases: <code>Formal</code> e <code>Informal</code>), exporta el link
    y pégalo en la constante <code>MODEL_URL</code> dentro de este archivo
    (busca <code>PEGA_AQUI_TU_LINK_DE_TEACHABLE_MACHINE</code>).
  </p>

  <button id="btnIniciar" type="button" onclick="init()">Iniciar cámara</button>

  <div id="webcam-container"></div>

  <div id="veredicto">—</div>
  <div id="confianza"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script>
    // 1) Entrena en https://teachablemachine.withgoogle.com/ (Image Project -> Standard)
    // 2) Export Model -> pestaña "Upload (shareable link)" -> Upload my model
    // 3) Copia el link que te dan (algo tipo https://teachablemachine.withgoogle.com/models/XXXXXXXX/)
    // 4) Pégalo abajo, entre comillas, reemplazando el texto de ejemplo.
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/E7RZPTK_w/";

    let model, webcam, maxPredictions;
    const veredictoEl = document.getElementById("veredicto");
    const confianzaEl = document.getElementById("confianza");

    async function init() {
      if (!MODEL_URL || MODEL_URL.includes("PEGA_AQUI")) {
        veredictoEl.textContent = "⚠️ Falta configurar MODEL_URL";
        return;
      }

      document.getElementById("btnIniciar").disabled = true;
      const modelURL = MODEL_URL + "model.json";
      const metadataURL = MODEL_URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      webcam = new tmImage.Webcam(360, 360, true); // ancho, alto, flip horizontal
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);
      document.getElementById("webcam-container").appendChild(webcam.canvas);
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);

      // clase con mayor probabilidad
      let mejor = prediction[0];
      for (let i = 1; i < maxPredictions; i++) {
        if (prediction[i].probability > mejor.probability) mejor = prediction[i];
      }

      const nombre = mejor.className.trim().toLowerCase();
      const confianza = (mejor.probability * 100).toFixed(0);

      document.body.classList.remove("formal", "informal");

      if (nombre.includes("informal")) {
        veredictoEl.textContent = "😅 INFORMAL";
        document.body.classList.add("informal");
      } else if (nombre.includes("formal")) {
        veredictoEl.textContent = "🎩 FORMAL";
        document.body.classList.add("formal");
      } else {
        veredictoEl.textContent = mejor.className;
      }

      confianzaEl.textContent = "Confianza: " + confianza + "%";
    }
  </script>
</body>
</html>
